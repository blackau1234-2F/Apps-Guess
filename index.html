<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一 App 即中！· 長者手機問答</title>
<style>
  body { font-family:"Microsoft JhengHei","PingFang HK",sans-serif; background:linear-gradient(180deg,#fff8e1,#e3f2fd); margin:0; padding:16px; color:#111; }
  .card { background:#fff; border-radius:28px; padding:26px; max-width:680px; margin:0 auto; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  h1 { color:#1f4e79; font-size:46px; margin:0 0 8px; text-align:center; letter-spacing:2px; }
  .subtitle { font-size:23px; font-weight:bold; color:#2e7d32; text-align:center; margin-bottom:18px; }
  .hero { text-align:center; margin:10px 0 18px; }
  .hero-emoji { font-size:88px; line-height:1; }
  .hero-text { font-size:26px; font-weight:bold; color:#1f4e79; margin-top:10px; }
  .hero-sub { font-size:20px; color:#555; margin-top:6px; }
  .badges { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0 20px; }
  .badge { background:#fff3cd; border:3px solid #f0a500; color:#7a4b00; font-size:20px; font-weight:bold; padding:10px 14px; border-radius:999px; }
  .progress { font-size:22px; font-weight:bold; color:#2e7d32; text-align:center; margin-bottom:14px; }
  .logo { width:130px; height:130px; border-radius:28px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:72px; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .question { font-size:28px; font-weight:bold; line-height:1.45; text-align:center; margin-bottom:18px; }
  .option { display:block; width:100%; box-sizing:border-box; margin:14px 0; padding:20px; font-size:27px; font-weight:bold; border:4px solid #1f4e79; background:#fff; border-radius:16px; text-align:center; }
  .correct { background:#c8e6c9 !important; border-color:#2e7d32 !important; }
  .wrong { background:#ffcdd2 !important; border-color:#c62828 !important; }
  .feedback { font-size:25px; font-weight:bold; min-height:34px; margin:10px 0; text-align:center; }
  button.primary { display:block; width:100%; padding:20px; font-size:27px; font-weight:bold; border:none; border-radius:18px; background:#1f4e79; color:#fff; margin-top:10px; }
  button.green { background:#2e7d32; }
  button.orange { background:#ef6c00; }
  .hidden { display:none; }
  .qr { text-align:center; margin:14px 0; }
  .qr img { max-width:100%; width:320px; border:10px solid #fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.15); }
  .note { font-size:19px; color:#555; margin-top:12px; text-align:center; }
  .back { background:#ef6c00; }
</style>
</head>
<body>
<div class="card">

  <div id="introPage">
    <h1>一 App 即中！</h1>
    <div class="subtitle">App 耆蹤大冒險 · 長者手機問答遊戲</div>
    <div class="hero">
      <div class="hero-emoji">🧑‍🦳📱🎉</div>
      <div class="hero-text">睇 Logo · 猜 App · 學生活</div>
      <div class="hero-sub">一齊做數碼生活小達人！</div>
    </div>
    <div class="badges">
      <div class="badge">💬 傾偈</div>
      <div class="badge">🗺️ 搵路</div>
      <div class="badge">🌤️ 睇天氣</div>
      <div class="badge">📷 影相</div>
    </div>
    <button class="primary orange" onclick="showQRPage()">📱 開始冒險：睇 QR Code</button>
    <button class="primary green" onclick="startGame()">▶️ 直接開始遊戲</button>
    <div class="note">唔使急，一齊慢慢玩、慢慢學！</div>
  </div>

  <div id="qrPage" class="hidden">
    <h1>掃一掃</h1>
    <div class="subtitle">用手機掃描 QR Code，即刻開始「一 App 即中！」</div>
    <div class="qr">
      <img id="introQrImg" alt="QR Code">
      <div class="note">如 QR Code 未顯示，請按下方按鈕重新生成。</div>
    </div>
    <button class="primary" onclick="showIntroQR()">🔄 重新生成 QR Code</button>
    <button class="primary green" onclick="startGame()">▶️ 直接開始遊戲</button>
    <button class="primary back" onclick="backToIntro()">⬅️ 返回首頁</button>
  </div>

  <div id="gameArea" class="hidden">
    <h1>一 App 即中！</h1>
    <div class="subtitle">App 耆蹤大冒險</div>
    <div class="progress" id="progress"></div>
    <div class="logo" id="logo"></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="next" onclick="nextQuestion()">下一題 →</button>
    <button class="primary green hidden" id="restart" onclick="restart()">再玩一次</button>
    <button class="primary back hidden" id="homeBtn" onclick="backToIntro()">⬅️ 返回首頁</button>
    <div class="note">唔緊要，慢慢揀；揀錯都可以再學。</div>
  </div>

</div>
<script>
const questions = [{"logo": "💬", "color": "#25D366", "name": "WhatsApp", "q": "呢個 App 可以同屋企人傾偈、傳相同視像通話，佢係邊個？", "options": ["WhatsApp", "Google Maps", "八達通"], "answer": 0}, {"logo": "▶️", "color": "#FF0000", "name": "YouTube", "q": "呢個 App 可以睇粵曲、新聞同教學影片，佢係邊個？", "options": ["相機", "YouTube", "日曆"], "answer": 1}, {"logo": "🌤️", "color": "#29B6F6", "name": "香港天文台", "q": "呢個 App 可以睇會唔會落雨同颱風消息，佢係邊個？", "options": ["WhatsApp", "Facebook", "香港天文台"], "answer": 2}, {"logo": "🗺️", "color": "#4285F4", "name": "Google Maps", "q": "呢個 App 可以幫你搵路、去酒樓同搭巴士，佢係邊個？", "options": ["Google Maps", "相機", "鬧鐘"], "answer": 0}, {"logo": "🚇", "color": "#F57C00", "name": "八達通", "q": "呢個 App 可以拍卡搭車同買嘢，佢係邊個？", "options": ["YouTube", "八達通", "電話"], "answer": 1}, {"logo": "⏰", "color": "#673AB7", "name": "鬧鐘", "q": "呢個 App 可以朝早叫你起身，佢係邊個？", "options": ["Google Maps", "銀行 App", "鬧鐘"], "answer": 2}, {"logo": "📅", "color": "#0F9D58", "name": "日曆", "q": "呢個 App 可以睇今日幾號同記住覆診，佢係邊個？", "options": ["相機", "日曆", "八達通"], "answer": 1}, {"logo": "🏦", "color": "#00695C", "name": "銀行 App", "q": "呢個 App 可以查銀行戶口結餘，佢係邊個？", "options": ["銀行 App", "YouTube", "WhatsApp"], "answer": 0}, {"logo": "🏥", "color": "#0072C6", "name": "醫管局 App", "q": "呢個 App 可以預約醫院服務同睇醫療資訊，佢係邊個？", "options": ["Facebook", "相機", "醫管局 App"], "answer": 2}, {"logo": "📷", "color": "#455A64", "name": "相機", "q": "呢個 App 可以影低孫仔孫女嘅相，佢係邊個？", "options": ["日曆", "相機", "Google Maps"], "answer": 1}];
let current = 0, score = 0, answered = false;

function showPage(id) {
  ["introPage","qrPage","gameArea"].forEach(p =>
    document.getElementById(p).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showQRPage() { showPage("qrPage"); showIntroQR(); }
function backToIntro() { showPage("introPage"); }

function showIntroQR() {
  const url = encodeURIComponent(window.location.href);
  document.getElementById("introQrImg").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=10&data=" + url;
}

function startGame() {
  current = 0; score = 0;
  showPage("gameArea");
  showQuestion();
}

function showQuestion() {
  answered = false;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").classList.add("hidden");
  document.getElementById("restart").classList.add("hidden");
  document.getElementById("homeBtn").classList.add("hidden");
  document.getElementById("progress").textContent = `第 ${current + 1} / ${questions.length} 題`;
  const q = questions[current];
  const logo = document.getElementById("logo");
  logo.textContent = q.logo;
  logo.style.background = q.color;
  document.getElementById("question").textContent = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = opt;
    b.onclick = () => choose(i, b);
    box.appendChild(b);
  });
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll(".option")[q.answer].classList.add("correct");
  if (i === q.answer) {
    score++;
    document.getElementById("feedback").textContent = "答啱晒！👏";
  } else {
    btn.classList.add("wrong");
    document.getElementById("feedback").textContent = "唔緊要，綠色就係正確答案。";
  }
  if (current + 1 < questions.length) {
    document.getElementById("next").classList.remove("hidden");
  } else {
    document.getElementById("restart").classList.remove("hidden");
    document.getElementById("homeBtn").classList.remove("hidden");
    document.getElementById("feedback").textContent = `完成！你答對咗 ${score} / ${questions.length} 題。`;
  }
}

function nextQuestion() { current++; showQuestion(); }
function restart() { current = 0; score = 0; showQuestion(); }
</script>
</body>
</html>
